<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가온누리 덱 모음</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f28;
    --panel2: #23262f;
    --border: #333744;
    --text: #f2f3f5;
    --muted: #9aa0ab;
    --blue: #4fa3e3;
    --gold: #e0b13a;
    --red: #e0505a;
    --pink: #e07ab0;
  }
  :root[data-theme="light"] {
    --bg: #eef1f6;
    --panel: #ffffff;
    --panel2: #f4f6f9;
    --border: #dbe1ea;
    --text: #1c2230;
    --muted: #6b7280;
    --blue: #2f80c9;
    --gold: #a8790e;
    --red: #cf3f4a;
    --pink: #c65a91;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: 24px;
    transition: background .15s, color .15s;
  }
  a { color: var(--blue); }
  input, select, textarea, button {
    font-family: inherit;
    font-size: 13px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }
  button { cursor: pointer; }

  /* ---------- 로그인 게이트 ---------- */
  #gate {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  #gate .box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px 28px; width: 320px; text-align: center;
  }
  #gate h2 { margin: 0 0 6px; font-size: 18px; }
  #gate p { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
  #gate input { width: 100%; margin-bottom: 10px; }
  #gate button { width: 100%; background: var(--blue); color: #fff; border: none; font-weight: 600; padding: 8px; }
  #gate .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* ---------- 상단 바 ---------- */
  .topbar {
    max-width: 960px; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 18px; margin: 0; }
  .topbar .right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pill-btn {
    border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
    font-size: 12px; padding: 6px 14px; border-radius: 20px;
  }
  .pill-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }
  .pill-btn.admin-on { background: var(--red); color: #fff; border-color: var(--red); font-weight: 600; }

  .layout { max-width: 960px; margin: 0 auto; }
  .main { min-width: 0; }

  /* ---------- 카테고리 탭 (레이드/아발론/대난투) ---------- */
  .category-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .cat-btn {
    flex: 1; text-align: center; padding: 10px 8px; border-radius: 10px; font-size: 14px; font-weight: 700;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted); cursor: pointer;
  }
  .cat-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* ---------- 덱 선택 (상단, 많은 덱을 줄바꿈으로 나열) ---------- */
  .deck-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .deck-picker .item {
    padding: 7px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; color: var(--text);
    background: var(--panel); border: 1px solid var(--border); white-space: nowrap;
  }
  .deck-picker .item:hover { background: var(--panel2); }
  .deck-picker .item.active { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }
  .deck-picker .newdeck { background: var(--panel2); border: 1px dashed var(--border); color: var(--muted); }
  .deck-picker .empty { color: var(--muted); font-size: 13px; padding: 8px 4px; }

  /* ---------- 관리자: 덱 카테고리 지정 ---------- */
  .cat-assign { display: flex; gap: 6px; margin: 0 0 10px; }
  .cat-assign button {
    padding: 5px 12px; border-radius: 8px; font-size: 12px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); cursor: pointer;
  }
  .cat-assign button.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 700; }

  /* ---------- 덱 카드 (기존 시안 디자인) ---------- */
  .deck {
    max-width: 900px;
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid var(--border);
  }
  :root[data-theme="light"] .deck { box-shadow: 0 4px 20px rgba(20,30,50,0.08); }
  .deck h1 { font-size: clamp(16px, 4.2vw, 22px); margin: 0 0 16px 4px; }
  .row { display: grid; gap: 10px; margin-bottom: 14px; }
  /* 캐릭터·장비·카드를 한 세트로 묶어 세로로 쌓고, 세트들을 한 줄에 나란히 배치.
     이렇게 하면 이 한 줄만 스크롤되므로(스크롤 컨테이너가 하나) 모바일에서 캐릭터/장비/카드가
     따로 놀지 않고 항상 같이 움직인다. */
  .row.charset { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); align-items: start; }
  .char-set { display: flex; flex-direction: column; gap: 6px; }
  .set-gear { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .row.pets { grid-template-columns: repeat(3, 0.72fr) 1.8fr; align-items: stretch; gap: 14px; }
  .row.pets > div:not(.position-box) { align-self: start; }

  .card-char { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid var(--border); background: var(--panel2); }
  .card-char img { width: 100%; display: block; aspect-ratio: 3/4; object-fit: cover; }
  .card-char .name { background: #000; color: #fff; text-align: center; font-size: clamp(10px, 2.6vw, 13px); padding: 6px 0; font-weight: 600; }
  .card-char .badge {
    position: absolute; top: 6px; right: 6px; min-width: 22px; height: 20px; padding: 0 7px;
    border-radius: 6px; color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,0.45);
  }
  .badge-front { background: linear-gradient(135deg, #e8636c, #c93540); }
  .badge-mid   { background: linear-gradient(135deg, #f0c96a, #cf9a2a); }
  .badge-back  { background: linear-gradient(135deg, #5cb0ea, #2f80c9); }

  .gear-cell { position: relative; text-align: center; }
  .gear-cell img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: var(--panel2); border-radius: 8px; border: 1px solid var(--border); padding: 6px; }

  .card-skill { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid var(--border); background: var(--panel2); }
  .card-skill img { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: 50% 50%; display: block; }
  .card-skill .name { background: #000; color: #fff; text-align: center; font-size: clamp(10px, 2.4vw, 12px); padding: 5px 0; }

  .pet-card { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid var(--border); background: var(--panel2); }
  .pet-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: 50% 22%; display: block; }
  .pet-card .name { background: #000; color: #fff; text-align: center; font-size: clamp(10px, 2.4vw, 12px); padding: 5px 0; }
  .pet-pos { text-align: center; font-size: 10px; color: var(--gold); margin-bottom: 4px; }

  .position-box { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; height: 100%; }
  .position-box .headers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 8px; flex: 0 0 auto; }
  .position-box .headers div { text-align: center; font-size: 12px; font-weight: 600; background: #2c3040; border-radius: 8px; padding: 5px 0; color: var(--text); }
  :root[data-theme="light"] .position-box .headers div { background: #e4e9f1; }
  .position-box .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1 1 auto; min-height: 0; }
  .position-col { display: flex; flex-direction: column; gap: 6px; justify-content: center; height: 100%; }
  .position-col.single { justify-content: center; }
  .position-col .slot { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .position-col.single .slot { flex: 0 0 auto; height: calc(50% - 3px); }
  .position-col img { width: 100%; flex: 1 1 auto; min-height: 0; border-radius: 8px; object-fit: cover; object-position: 50% 22%; border: 1px solid var(--border); }
  .position-col .pname { font-size: 11px; text-align: center; color: var(--muted); margin-top: 3px; flex: 0 0 auto; }

  .timeline { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 14px; }
  .timeline-title { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .cycle { margin-bottom: 16px; }
  .cycle:last-of-type { margin-bottom: 0; }
  .cycle-label { display: inline-block; font-size: 11px; font-weight: 700; color: #000; background: var(--gold); border-radius: 5px; padding: 2px 8px; margin-bottom: 8px; }
  /* 한 사이클의 스텝들은 줄바꿈으로 겹치듯 쌓이지 않고 항상 한 줄에 나오도록 한다.
     화면이 좁으면 칸 너비/간격을 줄여서 최대한 맞추고, 그래도 안 들어가면 가로 스크롤로 넘긴다. */
  .timeline-row { display: flex; align-items: flex-start; gap: clamp(2px, 1vw, 4px); flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  .step { display: flex; flex-direction: column; align-items: center; width: clamp(56px, 15vw, 92px); flex: 0 0 auto; position: relative; }
  .step-num { position: absolute; top: -4px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--gold); color: #000; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .step img { width: clamp(34px, 9vw, 48px); height: clamp(34px, 9vw, 48px); border-radius: 50%; object-fit: cover; object-position: 50% 22%; border: 2px solid var(--border); }
  .step-name { font-size: clamp(9px, 2.4vw, 10.5px); margin-top: 4px; text-align: center; color: var(--text); }
  .step-time { font-size: clamp(11px, 3vw, 13px); font-weight: 700; margin-top: 2px; text-align: center; color: var(--blue); }
  .step-memo { font-size: clamp(10px, 2.6vw, 12px); margin-top: 5px; text-align: center; color: var(--muted); line-height: 1.35; word-break: keep-all; border-top: 1px dashed var(--border); padding-top: 4px; width: 100%; }
  .arrow { color: var(--muted); font-size: clamp(11px, 2.8vw, 14px); padding-top: 12px; flex: 0 0 auto; }
  .warn-list { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); }
  .warn-item { color: var(--gold); font-size: 13px; line-height: 1.7; }
  .warn-item .tile-remove, .warn-list .add-btn.small { position: static; width: auto; height: auto; border-radius: 5px; padding: 1px 6px; font-size: 10px; margin-left: 6px; background: var(--red); vertical-align: middle; }
  .warn-list .add-btn.small { background: var(--panel2); color: var(--muted); margin-left: 0; }
  .note-tag { display: inline-block; background: #3a3020; color: var(--gold); font-size: 10px; border-radius: 4px; padding: 2px 6px; margin-bottom: 8px; }
  :root[data-theme="light"] .note-tag { background: #fbeecb; color: #8a6612; }

  .title-bar { position: relative; display: flex; align-items: center; min-height: 88px; border-radius: 12px; overflow: hidden; margin-bottom: 16px; background: var(--panel); }
  .title-boss { position: absolute; right: 0; top: 0; height: 100%; width: 720px; max-width: 78%; pointer-events: none; overflow: hidden; }
  .title-boss img {
    position: absolute; right: 0; top: 0; height: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; filter: saturate(1.05);
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 25%, rgba(0,0,0,0.7) 50%, rgba(0,0,0,0.92) 70%, rgba(0,0,0,1) 88%);
    mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 25%, rgba(0,0,0,0.7) 50%, rgba(0,0,0,0.92) 70%, rgba(0,0,0,1) 88%);
  }
  .title-boss::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(to right, var(--panel) 0%, rgba(32,43,61,0.95) 15%, rgba(38,55,79,0.8) 30%, rgba(47,75,108,0.6) 45%, rgba(61,102,144,0.4) 60%, rgba(79,131,173,0.2) 75%, rgba(79,163,227,0.06) 88%, rgba(79,163,227,0) 100%);
  }
  :root[data-theme="light"] .title-boss::before {
    background: linear-gradient(to right, var(--panel) 0%, rgba(255,255,255,0.95) 15%, rgba(219,234,247,0.8) 30%, rgba(179,214,240,0.6) 45%, rgba(148,198,232,0.4) 60%, rgba(115,180,224,0.2) 75%, rgba(79,163,227,0.06) 88%, rgba(79,163,227,0) 100%);
  }
  .title-text { position: relative; z-index: 2; padding: 10px 4px 10px 16px; }
  .title-text h1 { margin: 0 0 8px 0; }

  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }

  /* ---------- 관리자 편집 폼 ---------- */
  .small-btn { padding: 4px 10px; font-size: 11.5px; }
  .danger { background: var(--red); color: #fff; border: none; }
  .primary { background: var(--blue); color: #fff; border: none; font-weight: 600; }
  .save-bar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 10px 0; margin-top: 16px; display: flex; align-items: center; gap: 10px; justify-content: flex-end; z-index: 5; }
  .save-bar #save-msg { margin-right: auto; }
  .msg { font-size: 12.5px; padding: 8px 0; }
  .msg.ok { color: #6bd08a; }
  .msg.err { color: var(--red); }

  /* ---- 관리자 인라인 편집 ---- */
  #admin-hint { max-width: 960px; margin: 0 auto 10px; font-size: 12px; color: var(--gold); background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
  .deck.editing .card-char, .deck.editing .gear-cell, .deck.editing .card-skill, .deck.editing .pet-card, .deck.editing .step {
    outline: 1px dashed var(--border); outline-offset: 2px; cursor: pointer;
  }
  .tile-overlay { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; z-index: 1; }
  .tile-overlay.small { width: 48px; height: 48px; left: 50%; top: 0; transform: translateX(-50%); inset: auto; }
  .badge-select {
    position: absolute; top: 6px; right: 6px; z-index: 2; min-width: 22px; height: 20px;
    border: none; border-radius: 6px; font-size: 10.5px; font-weight: 700; padding: 0 3px;
    color: #fff; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.45); appearance: auto;
  }
  .badge-select.badge-front { background: linear-gradient(135deg, #e8636c, #c93540); }
  .badge-select.badge-mid   { background: linear-gradient(135deg, #f0c96a, #cf9a2a); }
  .badge-select.badge-back  { background: linear-gradient(135deg, #5cb0ea, #2f80c9); }
  /* 배지 select 자체는 흰 글씨(배지 디자인)지만, 펼쳐진 옵션 목록까지 흰 글씨면 안 보이므로
     옵션 목록만 따로 어두운 글씨/밝은 배경으로 지정 */
  .badge-select option { color: #111; background: #fff; }
  .tile-overlay option { color: #111; background: #fff; }
  .tile-overlay option[disabled] { color: #888; background: #eee; font-weight: 700; }
  .tile-remove { position: absolute; top: 8px; left: 8px; z-index: 2; width: 20px; height: 20px; line-height: 18px; padding: 0; border-radius: 50%; border: none; background: rgba(0,0,0,0.55); color: #fff; font-size: 13px; cursor: pointer; }
  .step .tile-remove.small { top: -4px; right: -4px; left: auto; width: 16px; height: 16px; line-height: 14px; font-size: 11px; }
  .add-row { text-align: center; margin: -4px 0 14px; }
  .add-btn { background: var(--panel2); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 14px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .add-btn.small { padding: 3px 8px; font-size: 10.5px; align-self: center; margin-left: 4px; }
  .editable-text { outline: none; border-radius: 4px; }
  .editable-text:hover, .editable-text:focus { background: var(--panel2); }
  .editable-text:empty:before { content: attr(data-placeholder); color: var(--muted); }
  .title-text h1.editable-text:empty:before { content: '덱 제목'; }
  .cycle-label-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cycle-label-row .tile-remove { position: static; width: auto; height: auto; border-radius: 5px; padding: 2px 8px; font-size: 10.5px; background: var(--red); }
  .title-boss.editable { pointer-events: auto; cursor: pointer; }

  /* ---- 드래그로 순서/자리 바꾸기 (캐릭터 세트 / 펫 / 스킬 타임라인 스텝 공통) ---- */
  .drag-handle {
    position: absolute; bottom: 6px; right: 6px; z-index: 3; width: 22px; height: 20px; line-height: 18px;
    text-align: center; padding: 0; border-radius: 6px; border: none; background: rgba(0,0,0,0.55);
    color: #fff; font-size: 13px; cursor: grab; touch-action: none; user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }
  /* .step에서는 step-num(좌상단)·삭제버튼(우상단)과 겹치지 않도록 바로 오른쪽에 배치 */
  .drag-handle.small { top: -4px; left: 22px; bottom: auto; right: auto; width: 16px; height: 16px; line-height: 14px; font-size: 10px; }
  .drag-source { opacity: 0.3; }
  .drag-over { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 10px; }
  .drag-ghost { position: fixed; pointer-events: none; z-index: 999; opacity: 0.9; box-shadow: 0 8px 24px rgba(0,0,0,0.5); margin: 0 !important; }

  /* ---------- 모바일 화면 ---------- */
  @media (max-width: 700px) {
    body { padding: 12px; }
    .topbar h1 { font-size: 16px; }
    .layout { flex-direction: column; gap: 12px; }
    .main { width: 100%; }
    .deck { padding: 14px 10px; border-radius: 12px; }
    .title-bar { min-height: 64px; }
    .title-boss { max-width: 65%; }

    /* 캐릭터+장비+카드가 "한 세트"로 묶여 있는 이 한 줄만 가로 스크롤한다.
       스크롤 컨테이너가 하나뿐이라 세 가지가 항상 같이 움직인다(따로 안 놀게 됨). */
    .row.charset {
      display: flex !important; overflow-x: auto; -webkit-overflow-scrolling: touch;
      gap: 8px; padding-bottom: 6px; scroll-snap-type: x proximity;
    }
    .char-set { flex: 0 0 84px; scroll-snap-align: start; }
    .gear-cell img { padding: 4px; }

    /* 펫 줄: 배치 미리보기 박스가 펫 3칸과 나란히 끼어 겹쳐 보이던 것을,
       펫 3칸을 먼저 한 줄로 보여주고 배치 박스는 그 아래로 내린다. */
    .row.pets { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .row.pets .position-box { grid-column: 1 / -1; margin-top: 4px; }
    .save-bar { flex-wrap: wrap; }
    .save-bar #save-msg { flex: 1 1 100%; margin-right: 0; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>가온누리 정보 모음</h2>
    <p>길드원 비밀번호를 입력해주세요</p>
    <input id="gate-pw" type="password" placeholder="비밀번호">
    <button onclick="tryLogin()">입장하기</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div class="topbar">
  <h1>가온누리 덱 모음</h1>
  <div class="right">
    <button class="pill-btn active" data-theme-btn="dark" onclick="setTheme('dark')">다크</button>
    <button class="pill-btn" data-theme-btn="light" onclick="setTheme('light')">라이트</button>
    <button class="pill-btn" id="admin-btn" onclick="onAdminBtn()">관리자 모드</button>
  </div>
</div>

<div class="layout">
  <div class="category-tabs" id="category-tabs"></div>
  <div class="deck-picker" id="deck-picker">
    <div class="empty">불러오는 중...</div>
  </div>
  <div class="main">
    <div id="admin-hint" style="display:none">관리자 모드: 이미지를 클릭하면 바로 바꿀 수 있고, 글자를 클릭하면 바로 고칠 수 있어요.</div>
    <div id="viewer"><div class="deck"><div class="empty">위에서 덱을 선택하세요</div></div></div>
    <div id="admin-bar" class="save-bar" style="display:none">
      <span id="save-msg" class="msg"></span>
      <button class="small-btn danger" id="admin-delete-btn" type="button">이 덱 삭제</button>
      <button class="small-btn" id="admin-revert-btn" type="button">되돌리기</button>
      <button class="pill-btn active" id="admin-save-btn" type="button">저장</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   설정: Apps Script 웹앱 배포 후 나오는 URL을 여기에 붙여넣으세요.
   예) https://script.google.com/macros/s/AKfycb.../exec
========================================================= */
var API_URL = "https://script.google.com/macros/s/AKfycbzlUzZRvtZuV0Y939_y49H6bxzeHaTOdg5kuHGUsJUbS7orzIbBRYaCRs8z9h78QnmcMQ/exec";

var state = {
  viewPw: '',
  adminPw: '',
  isAdmin: false,
  decks: [],
  category: '레이드', // 상단 카테고리 탭(레이드/아발론/대난투) 중 현재 선택된 것
  currentId: null,
  currentDeck: null,
  characters: [],
  pets: [],
  cards: [],
  icons: [],
  equip: { weapon: [], armor: [], item: [], rune: [] }
};

/* ---------- 유틸 ---------- */
function api(action, params, method, body) {
  params = params || {};
  method = method || 'GET';
  var url = API_URL + '?action=' + encodeURIComponent(action);
  Object.keys(params).forEach(function (k) { url += '&' + k + '=' + encodeURIComponent(params[k]); });
  if (method === 'GET') {
    return fetch(url).then(function (r) { return r.json(); });
  }
  return fetch(url, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action: action }, body || {}))
  }).then(function (r) { return r.json(); });
}

function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('[data-theme-btn]').forEach(function (b) {
    b.classList.toggle('active', b.dataset.themeBtn === t);
  });
  try { localStorage.setItem('gn_theme', t); } catch (e) {}
}

function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
}); }

/* ---------- 로그인 ---------- */
function tryLogin() {
  var pw = document.getElementById('gate-pw').value;
  document.getElementById('gate-err').textContent = '';
  api('list', { pw: pw }).then(function (res) {
    if (res.ok) {
      state.viewPw = pw;
      try { localStorage.setItem('gn_view_pw', pw); } catch (e) {}
      document.getElementById('gate').style.display = 'none';
      state.decks = res.decks;
      renderDeckList();
      var savedAdmin = null;
      try { savedAdmin = localStorage.getItem('gn_admin_pw'); } catch (e) {}
      if (savedAdmin) tryAdminLogin(savedAdmin, true);
    } else {
      document.getElementById('gate-err').textContent = '비밀번호가 올바르지 않습니다.';
    }
  }).catch(function () {
    document.getElementById('gate-err').textContent = 'API_URL 설정을 확인해주세요.';
  });
}

function onAdminBtn() {
  if (state.isAdmin) {
    state.isAdmin = false;
    state.adminPw = '';
    try { localStorage.removeItem('gn_admin_pw'); } catch (e) {}
    document.getElementById('admin-btn').textContent = '관리자 모드';
    document.getElementById('admin-btn').classList.remove('admin-on');
    renderCurrentDeck();
    return;
  }
  var pw = prompt('관리자 비밀번호를 입력하세요');
  if (pw == null) return;
  tryAdminLogin(pw, false);
}

function tryAdminLogin(pw, silent) {
  api('checkAdmin', { pw: pw }).then(function (res) {
    if (res.ok && res.isAdmin) {
      state.isAdmin = true;
      state.adminPw = pw;
      try { localStorage.setItem('gn_admin_pw', pw); } catch (e) {}
      document.getElementById('admin-btn').textContent = '관리자 모드 ON';
      document.getElementById('admin-btn').classList.add('admin-on');
      renderDeckList();
      loadLibraries().then(renderCurrentDeck);
    } else if (!silent) {
      alert('관리자 비밀번호가 올바르지 않습니다.');
    }
  });
}

/* ---------- 카테고리 탭 + 덱 선택(상단) ---------- */
var CATEGORIES = ['레이드', '아발론', '대난투'];

function deckCategory_(d) { return d.category || CATEGORIES[0]; } // 카테고리 없는 예전 덱은 "레이드"로 취급

function renderCategoryTabs() {
  var el = document.getElementById('category-tabs');
  el.innerHTML = CATEGORIES.map(function (cat) {
    return '<button type="button" class="cat-btn' + (cat === state.category ? ' active' : '') + '" onclick="selectCategory(\'' + cat + '\')">' + esc(cat) + '</button>';
  }).join('');
}

function selectCategory(cat) {
  state.category = cat;
  renderCategoryTabs();
  renderDeckPicker();
  // 지금 보고 있는 덱이 이 카테고리에 없으면 선택 해제
  var stillHere = state.decks.some(function (d) { return d.id === state.currentId && deckCategory_(d) === cat; });
  if (!stillHere) {
    state.currentId = null;
    state.currentDeck = null;
    renderCurrentDeck();
  }
}

function renderDeckPicker() {
  var el = document.getElementById('deck-picker');
  var decksInCat = state.decks.filter(function (d) { return deckCategory_(d) === state.category; });
  var html = decksInCat.map(function (d) {
    return '<div class="item' + (d.id === state.currentId ? ' active' : '') + '" onclick="selectDeck(\'' + d.id + '\')">' + esc(d.title) + '</div>';
  }).join('');
  if (state.isAdmin) {
    html += '<button type="button" class="item newdeck" onclick="newDeck()">+ 새 덱 만들기</button>';
  }
  el.innerHTML = html || '<div class="empty">이 카테고리에 등록된 덱이 없습니다</div>';
}

// 예전 renderDeckList() 호출부와의 호환을 위해 유지: 탭+피커를 한번에 다시 그린다.
function renderDeckList() {
  renderCategoryTabs();
  renderDeckPicker();
}

function selectDeck(id) {
  state.currentId = id;
  renderDeckList();
  api('get', { pw: state.viewPw, id: id }).then(function (res) {
    if (!res.ok) { document.getElementById('viewer').innerHTML = '<div class="deck"><div class="empty">불러오기 실패</div></div>'; return; }
    state.currentDeck = res.deck;
    if (state.isAdmin) { loadLibraries().then(renderCurrentDeck); } else { renderCurrentDeck(); }
  });
}

/* ---------- 현재 덱 그리기 (일반/관리자 공통) ---------- */
function renderCurrentDeck() {
  var viewer = document.getElementById('viewer');
  var deck = state.currentDeck;
  if (!deck) {
    viewer.innerHTML = '<div class="deck"><div class="empty">왼쪽에서 덱을 선택하세요</div></div>';
    document.getElementById('admin-bar').style.display = 'none';
    document.getElementById('admin-hint').style.display = 'none';
    return;
  }
  var editable = !!state.isAdmin;
  viewer.innerHTML = renderDeckHtml(deck, editable);
  if (editable) {
    wireAdminInline_(viewer, deck);
    document.getElementById('admin-bar').style.display = 'flex';
    document.getElementById('admin-hint').style.display = 'block';
    wireAdminBar_(deck);
  } else {
    document.getElementById('admin-bar').style.display = 'none';
    document.getElementById('admin-hint').style.display = 'none';
  }
}

/* =========================================================
   덱 렌더러 (시안 디자인 그대로, 데이터 기반)
========================================================= */
var COL_ORDER = { '후열': 0, '중열': 1, '전열': 2 };
var COL_BADGE = { '후열': 'badge-back', '중열': 'badge-mid', '전열': 'badge-front' };

function sortedCharsForRow(characters) {
  // 상단 카드/장비/스킬카드 행 순서: 후열→중열→전열, 같은 열이면 slot2가 slot1보다 왼쪽(즉 slot 내림차순)
  return characters.slice().sort(function (a, b) {
    var ca = COL_ORDER[a.col], cb = COL_ORDER[b.col];
    if (ca !== cb) return ca - cb;
    return b.slot - a.slot;
  });
}

var POS_OPTIONS = [
  ['후열:1', '후열1'], ['후열:2', '후열2'],
  ['중열:1', '중열1'], ['중열:2', '중열2'],
  ['전열:1', '전열1'], ['전열:2', '전열2']
];
function posOptionsHtml_(col, slot) {
  var cur = col + ':' + slot;
  return POS_OPTIONS.map(function (p) {
    return '<option value="' + p[0] + '"' + (p[0] === cur ? ' selected' : '') + '>' + p[1] + '</option>';
  }).join('');
}

// deck: 덱 데이터. editable: true면 이미지 클릭→드롭다운 교체, 글자 클릭→직접 수정이 가능한 관리자용 마크업을 함께 그린다.
function renderDeckHtml(deck, editable) {
  var chars = sortedCharsForRow(deck.characters || []);

  // 캐릭터·장비·카드를 한 세트로 묶어서 세로 한 칸(.char-set)에 그린다.
  // (예전에는 캐릭터/장비/카드가 각각 따로 된 가로줄이라 모바일에서 셋이 따로 스크롤됐음 —
  //  이제 스크롤 컨테이너가 하나뿐이라 항상 같이 움직인다.)
  var charSetsHtml = chars.map(function (c) {
    var idx = (deck.characters || []).indexOf(c);
    var badge = editable
      ? '<select class="badge-select ' + COL_BADGE[c.col] + '" data-edit-pos="' + idx + '">' + posOptionsHtml_(c.col, c.slot) + '</select>'
      : '<div class="badge ' + COL_BADGE[c.col] + '">' + c.slot + '</div>';
    var charOverlay = editable ? '<select class="tile-overlay" data-edit-char="' + idx + '">' + optionsHtml_(state.characters, c.name) + '</select>' : '';
    var removeBtn = editable ? '<button type="button" class="tile-remove" data-remove-char="' + idx + '" title="캐릭터 삭제">×</button>' : '';
    var dragHandle = editable ? '<button type="button" class="drag-handle" data-drag-handle="set" title="드래그해서 이 세트(캐릭터·장비·카드)를 다른 자리와 바꾸기">⠿</button>' : '';
    var charTile = '<div class="card-char' + (editable ? ' editable' : '') + '"><img src="' + esc(c.portrait) + '">' +
      badge + '<div class="name">' + esc(c.name) + '</div>' + charOverlay + removeBtn + dragHandle + '</div>';

    var gearGrid = '<div class="set-gear">' +
      gearCell_(c.weapon, idx, 'weapon', editable) + gearCell_(c.armor, idx, 'armor', editable) +
      gearCell_(c.item, idx, 'item', editable) + gearCell_(c.rune, idx, 'rune', editable) +
      '</div>';

    // 카드는 캐릭터와 완전히 독립적으로 고를 수 있다 (자기 카드가 아닌 다른 카드를 쓰는 경우가 더 많음).
    // 아직 카드가 따로 지정되지 않은 기존 덱은 캐릭터 이름/이미지를 그대로 보여준다(예전 방식과 호환).
    // 이름 표시는 "~카드"라는 말 없이 이름만 보여준다.
    var cardName = (c.card && c.card.name) || c.name;
    var cardImg = (c.card && c.card.img) || '';
    var cardOverlay = editable ? '<select class="tile-overlay" data-edit-card="' + idx + '">' + optionsHtml_(state.cards, cardName, stripCardWord_) + '</select>' : '';
    var cardTile = '<div class="card-skill' + (editable ? ' editable' : '') + '"><img src="' + esc(cardImg) + '"><div class="name">' + esc(stripCardWord_(cardName)) + '</div>' + cardOverlay + '</div>';

    return '<div class="char-set"' + (editable ? ' data-drag-set="' + idx + '"' : '') + '>' + charTile + gearGrid + cardTile + '</div>';
  }).join('');

  var pets = deck.pets || [];
  var petOrder = { '후열': 0, '중열': 1, '전열': 2 };
  var posList = editable ? ['후열', '중열', '전열'] : pets.slice().sort(function (a, b) { return petOrder[a.pos] - petOrder[b.pos]; }).map(function (p) { return p.pos; });
  var petsHtml = posList.map(function (pos) {
    var p = pets.find(function (x) { return x.pos === pos; }) || { pos: pos, name: '', img: '' };
    var overlay = editable ? '<select class="tile-overlay" data-edit-pet="' + pos + '">' + optionsHtml_(state.pets, p.name) + '</select>' : '';
    var dragHandle = editable ? '<button type="button" class="drag-handle" data-drag-handle="pet" title="드래그해서 자리 바꾸기">⠿</button>' : '';
    return '<div><div class="pet-pos">' + esc(pos) + ' 펫</div>' +
      '<div class="pet-card' + (editable ? ' editable' : '') + '"' + (editable ? ' data-drag-pet="' + esc(pos) + '"' : '') + '><img src="' + esc(p.img) + '"><div class="name">' + esc(p.name) + '</div>' + overlay + dragHandle + '</div></div>';
  }).join('');

  // position box: 컬럼별 그룹핑, slot 오름차순 (1 위 / 2 아래) — 배치 미리보기, 읽기 전용
  var byCol = { '후열': [], '중열': [], '전열': [] };
  chars.forEach(function (c) { byCol[c.col].push(c); });
  Object.keys(byCol).forEach(function (k) { byCol[k].sort(function (a, b) { return a.slot - b.slot; }); });
  function posColHtml(col) {
    var arr = byCol[col];
    var single = arr.length <= 1 ? ' single' : '';
    var slots = arr.map(function (c) {
      return '<div class="slot"><img src="' + esc(c.portrait) + '"><div class="pname">' + esc(c.name) + '</div></div>';
    }).join('');
    return '<div class="position-col' + single + '">' + slots + '</div>';
  }
  var positionBoxHtml = '<div class="position-box"><div class="headers"><div>후열</div><div>중열</div><div>전열</div></div>' +
    '<div class="cols">' + posColHtml('후열') + posColHtml('중열') + posColHtml('전열') + '</div></div>';

  // 스킬 타임라인에는 이 덱에 실제로 들어있는 5명(위쪽 캐릭터 줄)만 후보로 보여준다.
  // 다른 캐릭터가 타임라인에 들어갈 일은 없으므로 전체 라이브러리 대신 이 목록만 쓴다.
  var deckCharOptions = chars.filter(function (c) { return c.name; }).map(function (c) { return { name: c.name }; });

  var timelineHtml = '';
  if (editable || (deck.timeline && deck.timeline.cycles && deck.timeline.cycles.length)) {
    var cycles = (deck.timeline && deck.timeline.cycles) || [];
    var cyclesHtml = cycles.map(function (cy, ci) {
      var stepsHtml = cy.steps.map(function (s, si) {
        var isLast = si === cy.steps.length - 1;
        var arrow = (!isLast || editable) ? '<div class="arrow">→</div>' : '';
        var charOverlay = editable ? '<select class="tile-overlay small" data-edit-step="' + ci + ':' + si + '">' + optionsHtml_(deckCharOptions, s.name) + '</select>' : '';
        var tagHtml = editable
          ? '<div class="step-time editable-text" contenteditable="true" data-step-field="tag:' + ci + ':' + si + '" data-placeholder="배수">' + esc(s.tag) + '</div>'
          : (s.tag ? '<div class="step-time">' + esc(s.tag) + '</div>' : '');
        var memoHtml = editable
          ? '<div class="step-memo editable-text" contenteditable="true" data-step-field="memo:' + ci + ':' + si + '" data-placeholder="메모">' + esc(s.memo) + '</div>'
          : (s.memo ? '<div class="step-memo">' + esc(s.memo) + '</div>' : '');
        var removeBtn = editable ? '<button type="button" class="tile-remove small" data-remove-step="' + ci + ':' + si + '" title="스텝 삭제">×</button>' : '';
        var dragHandle = editable ? '<button type="button" class="drag-handle small" data-drag-handle="step" title="드래그해서 순서 바꾸기">⠿</button>' : '';
        return '<div class="step' + (editable ? ' editable' : '') + '"' + (editable ? ' data-drag-step="' + ci + ':' + si + '"' : '') + '><div class="step-num">' + (si + 1) + '</div>' +
          '<img src="' + esc(s.img) + '"><div class="step-name">' + esc(s.name) + '</div>' +
          tagHtml + memoHtml + charOverlay + removeBtn + dragHandle +
          '</div>' + arrow;
      }).join('');
      var addStepBtn = editable ? '<button type="button" class="add-btn small" data-add-step="' + ci + '">+ 스텝 추가</button>' : '';
      var cycleLabel = editable
        ? '<span class="cycle-label editable-text" contenteditable="true" data-cycle-field="' + ci + '">' + esc(cy.label) + '</span><button type="button" class="tile-remove small" data-remove-cycle="' + ci + '" title="사이클 삭제">사이클 삭제</button>'
        : '<div class="cycle-label">' + esc(cy.label) + '</div>';
      return '<div class="cycle"><div class="cycle-label-row">' + cycleLabel + '</div><div class="timeline-row">' + stepsHtml + addStepBtn + '</div></div>';
    }).join('');
    var addCycleBtn = editable ? '<button type="button" class="add-btn" data-add-cycle>+ 사이클 추가</button>' : '';
    timelineHtml = '<div class="timeline"><div class="timeline-title">스킬 타임라인 — 사이클별 사용 횟수/순서는 덱마다 다를 수 있음</div>' + cyclesHtml + addCycleBtn;

    var warnings = deck.warnings || [];
    if (editable || warnings.length) {
      var warnHtml = warnings.map(function (w, wi) {
        var removeBtn = editable ? '<button type="button" class="tile-remove small" data-remove-warn="' + wi + '" title="삭제">×</button>' : '';
        var text = editable
          ? '<span class="editable-text" contenteditable="true" data-warn-field="' + wi + '" data-placeholder="주의사항 입력">' + esc(w) + '</span>'
          : esc(w);
        return '<div class="warn-item">※ ' + text + removeBtn + '</div>';
      }).join('');
      var addWarnBtn = editable ? '<button type="button" class="add-btn small" data-add-warn>+ 주의사항 추가</button>' : '';
      timelineHtml += '<div class="warn-list">' + warnHtml + addWarnBtn + '</div>';
    }
    timelineHtml += '</div>';
  }

  var catAssignHtml = editable
    ? '<div class="cat-assign">' + CATEGORIES.map(function (cat) {
        return '<button type="button" class="' + (deckCategory_(deck) === cat ? 'active' : '') + '" data-set-category="' + esc(cat) + '">' + esc(cat) + '</button>';
      }).join('') + '</div>'
    : '';

  var bossImg = '<img src="' + esc(deck.bossIcon || '') + '">';
  var titleBar = '<div class="title-bar">' +
    (editable
      ? '<div class="title-boss editable" data-edit-boss title="클릭해서 보스 이미지 URL 바꾸기">' + bossImg + '</div>'
      : (deck.bossIcon ? '<div class="title-boss">' + bossImg + '</div>' : '')) +
    '<div class="title-text">' +
    (editable ? '<h1 class="editable-text" contenteditable="true" data-field="title">' + esc(deck.title) + '</h1>' : '<h1>' + esc(deck.title) + '</h1>') +
    (editable
      ? '<span class="note-tag editable-text" contenteditable="true" data-field="noteTag" data-placeholder="태그(선택)">' + esc(deck.noteTag) + '</span>'
      : (deck.noteTag ? '<span class="note-tag">' + esc(deck.noteTag) + '</span>' : '')) +
    '</div></div>';

  var addCharRow = editable ? '<div class="add-row"><button type="button" class="add-btn" data-add-char>+ 캐릭터 추가</button></div>' : '';

  return '<div class="deck' + (editable ? ' editing' : '') + '">' + catAssignHtml + titleBar +
    '<div class="row charset" style="grid-template-columns:repeat(' + chars.length + ',1fr)">' + charSetsHtml + '</div>' +
    addCharRow +
    '<div class="row pets">' + petsHtml + positionBoxHtml + '</div>' +
    timelineHtml +
    '</div>';
}

function gearCell_(g, idx, kind, editable) {
  var name = (g && g.name) || '';
  var icon = (g && g.icon) || '';
  var overlay = editable ? '<select class="tile-overlay" data-edit-gear="' + idx + ':' + kind + '">' + optionsHtml_(state.equip[kind] || [], name) + '</select>' : '';
  return '<div class="gear-cell' + (editable ? ' editable' : '') + '"><img src="' + esc(icon) + '" title="' + esc(name) + '">' + overlay + '</div>';
}

/* =========================================================
   관리자 편집 폼
========================================================= */
function blankCharSlot_(col, slot) {
  return { col: col, slot: slot, name: '', portrait: '', weapon: {}, armor: {}, item: {}, rune: {}, card: {} };
}

function newDeck() {
  var id = 'deck_' + Date.now();
  var blank = {
    id: id, title: '새 덱', category: state.category, noteTag: '', bossIcon: '',
    // 대부분의 덱은 5명(후열1 · 중열2 · 전열2) 구성이라 기본으로 5칸을 미리 만들어 둔다.
    // 필요하면 "+ 캐릭터 추가"로 더 넣거나, 빈 칸을 그대로 두면 저장 시 제외된다.
    characters: [
      blankCharSlot_('후열', 1),
      blankCharSlot_('중열', 1),
      blankCharSlot_('중열', 2),
      blankCharSlot_('전열', 1),
      blankCharSlot_('전열', 2)
    ],
    pets: [], timeline: { cycles: [] }, warnings: []
  };
  state.currentId = id;
  state.currentDeck = blank;
  state.decks.push({ id: id, title: '새 덱', category: state.category });
  renderDeckList();
  loadLibraries().then(renderCurrentDeck);
}

function loadLibraries() {
  if (state.characters.length) return Promise.resolve();
  return Promise.all([
    api('characters', { pw: state.viewPw }).then(function (r) { if (r.ok) state.characters = r.characters; }),
    api('pets', { pw: state.viewPw }).then(function (r) { if (r.ok) state.pets = r.pets; }),
    api('cards', { pw: state.viewPw }).then(function (r) { if (r.ok) state.cards = r.cards; }),
    api('icons', { pw: state.viewPw }).then(function (r) { if (r.ok) state.icons = r.icons; }),
    api('equip', { pw: state.viewPw }).then(function (r) { if (r.ok) state.equip = r.equip; })
  ]);
}

function findChar_(name) { return state.characters.find(function (c) { return !c.divider && c.name === name; }); }
function findPet_(name) { return state.pets.find(function (p) { return !p.divider && p.name === name; }); }
function findCard_(name) { return state.cards.find(function (c) { return !c.divider && c.name === name; }); }
function findEquip_(kind, name) { return (state.equip[kind] || []).find(function (i) { return !i.divider && i.name === name; }); }
function findIcon_(name) { return state.icons.find(function (i) { return i.name === name; }); }

// list: {name} 항목과 {divider:true,label} 구분줄 항목이 섞인 배열(캐릭터/카드/펫/장비 라이브러리 공통 형식).
// 구분줄은 선택 불가능한 회색 옵션으로 표시된다.
// 카드 이름 끝에 붙는 "카드"라는 말은 화면에 표시할 때만 떼어낸다 (예: "염제 카드" -> "염제").
// 실제 값(선택/매칭용 value)은 원본 이름을 그대로 쓴다.
function stripCardWord_(name) {
  if (!name) return name;
  var stripped = String(name).replace(/\s*카드\s*$/, '').trim();
  return stripped || name;
}

function optionsHtml_(list, selected, labelFn) {
  var html = '<option value="">-</option>';
  (list || []).forEach(function (item) {
    if (item.divider) {
      html += '<option value="" disabled>── ' + esc(item.label) + ' ──</option>';
      return;
    }
    var label = labelFn ? labelFn(item.name) : item.name;
    html += '<option value="' + esc(item.name) + '"' + (item.name === selected ? ' selected' : '') + '>' + esc(label) + '</option>';
  });
  return html;
}

/* =========================================================
   드래그로 자리 바꾸기 — 캐릭터 세트(캐릭터+장비+카드) / 펫 / 스킬 타임라인 스텝 공통.
   Pointer Events 기반이라 마우스와 모바일 터치 모두에서 동작한다(손가락으로 꾹 누른 채 이동).
   각 항목의 "⠿" 손잡이를 누르고 있다가 다른 항목 위로 옮기면 두 항목이 서로 자리를 바꾼다.
========================================================= */
var _dragCtl = { active: null, inited: false };

function initDragReorderOnce_() {
  if (_dragCtl.inited) return;
  _dragCtl.inited = true;

  function clearDragOver(st) {
    st.container.querySelectorAll('.drag-over').forEach(function (el) { el.classList.remove('drag-over'); });
  }

  document.addEventListener('pointermove', function (e) {
    var st = _dragCtl.active;
    if (!st || e.pointerId !== st.pointerId) return;
    var dx = e.clientX - st.startX, dy = e.clientY - st.startY;
    if (!st.moved) {
      if (Math.hypot(dx, dy) < 6) return;
      st.moved = true;
      var rect = st.item.getBoundingClientRect();
      var ghost = st.item.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.style.left = rect.left + 'px';
      ghost.style.top = rect.top + 'px';
      ghost.style.width = rect.width + 'px';
      ghost.style.height = rect.height + 'px';
      document.body.appendChild(ghost);
      st.ghost = ghost;
      st.item.classList.add('drag-source');
    }
    st.ghost.style.left = (e.clientX - st.offsetX) + 'px';
    st.ghost.style.top = (e.clientY - st.offsetY) + 'px';
    st.ghost.style.display = 'none';
    var elUnder = document.elementFromPoint(e.clientX, e.clientY);
    st.ghost.style.display = '';
    var targetItem = elUnder && elUnder.closest ? elUnder.closest('[' + st.itemAttr + ']') : null;
    clearDragOver(st);
    if (targetItem && targetItem !== st.item) {
      targetItem.classList.add('drag-over');
      st.targetKey = targetItem.getAttribute(st.itemAttr);
    } else {
      st.targetKey = null;
    }
  });

  function endDrag(e) {
    var st = _dragCtl.active;
    if (!st || e.pointerId !== st.pointerId) return;
    if (st.ghost) st.ghost.remove();
    if (st.item) st.item.classList.remove('drag-source');
    clearDragOver(st);
    if (st.moved && st.targetKey && st.targetKey !== st.key) {
      st.onDrop(st.key, st.targetKey);
    }
    _dragCtl.active = null;
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
}

// container: 다시 그려질 때마다 새로 넘겨받는 루트 엘리먼트.
// handleSelector: 손잡이 버튼 셀렉터 (예: '[data-drag-handle="set"]').
// itemAttr: 손잡이가 속한 항목을 식별하는 data-* 속성 이름 (예: 'data-drag-set').
// onDrop(sourceKey, targetKey): 두 항목을 서로 바꿔치기하는 콜백.
function wireDragReorder_(container, handleSelector, itemAttr, onDrop) {
  initDragReorderOnce_();
  container.querySelectorAll(handleSelector).forEach(function (handle) {
    handle.addEventListener('pointerdown', function (e) {
      var item = handle.closest('[' + itemAttr + ']');
      if (!item) return;
      e.preventDefault();
      var rect = item.getBoundingClientRect();
      _dragCtl.active = {
        pointerId: e.pointerId,
        key: item.getAttribute(itemAttr),
        item: item,
        container: container,
        itemAttr: itemAttr,
        startX: e.clientX, startY: e.clientY,
        offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
        moved: false, ghost: null, targetKey: null,
        onDrop: onDrop
      };
    });
  });
}

/* =========================================================
   관리자 인라인 편집 — 화면에 보이는 이미지/글자를 직접 클릭해서 수정
========================================================= */
function wireAdminInline_(container, deck) {
  function refresh() { renderCurrentDeck(); }

  // 드래그로 자리 바꾸기: 캐릭터 세트(캐릭터+장비+카드가 한 세트) / 펫 / 스킬 타임라인 스텝
  wireDragReorder_(container, '[data-drag-handle="set"]', 'data-drag-set', function (srcKey, tgtKey) {
    var a = deck.characters[Number(srcKey)], b = deck.characters[Number(tgtKey)];
    if (!a || !b) return;
    var tmpCol = a.col, tmpSlot = a.slot;
    a.col = b.col; a.slot = b.slot;
    b.col = tmpCol; b.slot = tmpSlot;
    refresh();
  });
  wireDragReorder_(container, '[data-drag-handle="pet"]', 'data-drag-pet', function (srcKey, tgtKey) {
    var pets = deck.pets || [];
    var a = pets.find(function (p) { return p.pos === srcKey; });
    var b = pets.find(function (p) { return p.pos === tgtKey; });
    if (a) a.pos = tgtKey;
    if (b) b.pos = srcKey;
    refresh();
  });
  wireDragReorder_(container, '[data-drag-handle="step"]', 'data-drag-step', function (srcKey, tgtKey) {
    var sp = srcKey.split(':'), tp = tgtKey.split(':');
    var sArr = deck.timeline.cycles[Number(sp[0])] && deck.timeline.cycles[Number(sp[0])].steps;
    var tArr = deck.timeline.cycles[Number(tp[0])] && deck.timeline.cycles[Number(tp[0])].steps;
    if (!sArr || !tArr) return;
    var si = Number(sp[1]), ti = Number(tp[1]);
    var tmp = sArr[si];
    sArr[si] = tArr[ti];
    tArr[ti] = tmp;
    refresh();
  });

  // 이미지 클릭 → 드롭다운 교체 계열
  container.querySelectorAll('[data-edit-char]').forEach(function (sel) {
    sel.onchange = function (e) {
      var idx = Number(sel.dataset.editChar);
      var c = deck.characters[idx];
      c.name = e.target.value;
      var lib = findChar_(c.name);
      c.portrait = lib ? lib.portrait : '';
      // 카드는 캐릭터와 별개로 관리하므로 여기서는 건드리지 않는다.
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-card]').forEach(function (sel) {
    sel.onchange = function (e) {
      var idx = Number(sel.dataset.editCard);
      var c = deck.characters[idx];
      var name = e.target.value;
      var lib = findCard_(name);
      c.card = { name: name, img: lib ? lib.image : '' };
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-gear]').forEach(function (sel) {
    sel.onchange = function (e) {
      var parts = sel.dataset.editGear.split(':');
      var idx = Number(parts[0]), kind = parts[1];
      deck.characters[idx][kind] = gearFromEquip_(kind, e.target.value);
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-pet]').forEach(function (sel) {
    sel.onchange = function (e) {
      var pos = sel.dataset.editPet;
      var name = e.target.value;
      deck.pets = (deck.pets || []).filter(function (p) { return p.pos !== pos; });
      if (name) {
        var lib = findPet_(name);
        deck.pets.push({ pos: pos, name: name, img: lib ? lib.image : '' });
      }
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-pos]').forEach(function (sel) {
    sel.onchange = function (e) {
      var idx = Number(sel.dataset.editPos);
      var parts = e.target.value.split(':');
      deck.characters[idx].col = parts[0];
      deck.characters[idx].slot = Number(parts[1]);
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-step]').forEach(function (sel) {
    sel.onchange = function (e) {
      var parts = sel.dataset.editStep.split(':');
      var ci = Number(parts[0]), si = Number(parts[1]);
      var s = deck.timeline.cycles[ci].steps[si];
      s.name = e.target.value;
      var lib = findChar_(s.name);
      s.img = lib ? lib.portrait : '';
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-boss]').forEach(function (el) {
    el.onclick = function () {
      var v = prompt('보스 이미지 URL을 입력하세요', deck.bossIcon || '');
      if (v === null) return;
      deck.bossIcon = v.trim();
      refresh();
    };
  });
  container.querySelectorAll('[data-set-category]').forEach(function (btn) {
    btn.onclick = function () {
      deck.category = btn.dataset.setCategory;
      refresh();
    };
  });

  // 글자 클릭 → 바로 수정 (contenteditable). 재렌더링 없이 데이터만 갱신해서 커서 위치 유지.
  container.querySelectorAll('[contenteditable="true"]').forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  });
  container.querySelectorAll('[data-field]').forEach(function (el) {
    el.oninput = function () { deck[el.dataset.field] = el.textContent.trim(); };
  });
  container.querySelectorAll('[data-step-field]').forEach(function (el) {
    el.oninput = function () {
      var parts = el.dataset.stepField.split(':');
      deck.timeline.cycles[Number(parts[1])].steps[Number(parts[2])][parts[0]] = el.textContent.trim();
    };
  });
  container.querySelectorAll('[data-cycle-field]').forEach(function (el) {
    el.oninput = function () { deck.timeline.cycles[Number(el.dataset.cycleField)].label = el.textContent.trim(); };
  });
  container.querySelectorAll('[data-warn-field]').forEach(function (el) {
    el.oninput = function () { deck.warnings[Number(el.dataset.warnField)] = el.textContent.trim(); };
  });

  // 삭제 버튼
  container.querySelectorAll('[data-remove-char]').forEach(function (btn) {
    btn.onclick = function () { deck.characters.splice(Number(btn.dataset.removeChar), 1); refresh(); };
  });
  container.querySelectorAll('[data-remove-step]').forEach(function (btn) {
    btn.onclick = function () {
      var parts = btn.dataset.removeStep.split(':');
      deck.timeline.cycles[Number(parts[0])].steps.splice(Number(parts[1]), 1);
      refresh();
    };
  });
  container.querySelectorAll('[data-remove-cycle]').forEach(function (btn) {
    btn.onclick = function () { deck.timeline.cycles.splice(Number(btn.dataset.removeCycle), 1); refresh(); };
  });
  container.querySelectorAll('[data-remove-warn]').forEach(function (btn) {
    btn.onclick = function () { deck.warnings.splice(Number(btn.dataset.removeWarn), 1); refresh(); };
  });

  // 추가 버튼
  var addCharBtn = container.querySelector('[data-add-char]');
  if (addCharBtn) addCharBtn.onclick = function () {
    deck.characters = deck.characters || [];
    deck.characters.push({ col: '전열', slot: 1, name: '', portrait: '', weapon: {}, armor: {}, item: {}, rune: {}, card: {} });
    refresh();
  };
  container.querySelectorAll('[data-add-step]').forEach(function (btn) {
    btn.onclick = function () {
      var ci = Number(btn.dataset.addStep);
      deck.timeline.cycles[ci].steps.push({ name: '', img: '', tag: '', memo: '' });
      refresh();
    };
  });
  var addCycleBtn = container.querySelector('[data-add-cycle]');
  if (addCycleBtn) addCycleBtn.onclick = function () {
    if (!deck.timeline) deck.timeline = { cycles: [] };
    deck.timeline.cycles.push({ label: (deck.timeline.cycles.length + 1) + '사이클', steps: [] });
    refresh();
  };
  var addWarnBtn = container.querySelector('[data-add-warn]');
  if (addWarnBtn) addWarnBtn.onclick = function () {
    deck.warnings = deck.warnings || [];
    deck.warnings.push('');
    refresh();
  };
}

function wireAdminBar_(deck) {
  document.getElementById('admin-save-btn').onclick = function () { saveDeck_ui(deck); };
  document.getElementById('admin-delete-btn').onclick = function () { deleteDeck_ui(deck.id); };
  document.getElementById('admin-revert-btn').onclick = function () {
    if (!confirm('저장하지 않은 수정 내용을 취소하고 마지막 저장 상태로 되돌릴까요?')) return;
    if (state.currentId) selectDeck(state.currentId);
  };
}

function gearFromEquip_(kind, name) {
  if (!name) return { name: '', icon: '' };
  var lib = findEquip_(kind, name);
  return { name: name, icon: lib ? lib.image : '' };
}

function saveDeck_ui(d) {
  var msg = document.getElementById('save-msg');
  msg.textContent = '저장 중...';
  msg.className = 'msg';
  // 새 덱을 만들 때 미리 깔아둔 빈 캐릭터 칸(이름 미지정)은 저장에서 제외한다.
  var payload = Object.assign({}, d, {
    characters: (d.characters || []).filter(function (c) { return c.name; })
  });
  api('save', {}, 'POST', { pw: state.adminPw, deck: payload, who: '관리자' }).then(function (res) {
    if (res.ok) {
      msg.textContent = '저장되었습니다.';
      msg.className = 'msg ok';
      state.currentDeck = d;
      var found = state.decks.find(function (x) { return x.id === d.id; });
      if (found) { found.title = d.title; found.category = d.category; }
      else state.decks.push({ id: d.id, title: d.title, category: d.category });
      renderDeckList();
    } else {
      msg.textContent = '저장 실패: ' + (res.error || '');
      msg.className = 'msg err';
    }
  });
}

function deleteDeck_ui(id) {
  if (!confirm('이 덱을 삭제할까요? 되돌릴 수 없습니다.')) return;
  api('delete', {}, 'POST', { pw: state.adminPw, id: id }).then(function (res) {
    if (res.ok) {
      state.decks = state.decks.filter(function (x) { return x.id !== id; });
      state.currentId = null;
      state.currentDeck = null;
      renderCurrentDeck();
      renderDeckList();
    } else {
      alert('삭제 실패: ' + (res.error || ''));
    }
  });
}

/* ---------- 시작 ---------- */
(function init() {
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('gn_theme'); } catch (e) {}
  if (savedTheme) setTheme(savedTheme);

  var savedPw = null;
  try { savedPw = localStorage.getItem('gn_view_pw'); } catch (e) {}
  if (savedPw) {
    document.getElementById('gate-pw').value = savedPw;
    tryLogin();
  }
})();
</script>
