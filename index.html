<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가온누리 덱 모음</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f28;
    --panel2: #23262f;
    --border: #333744;
    --text: #f2f3f5;
    --muted: #9aa0ab;
    --blue: #4fa3e3;
    --gold: #e0b13a;
    --red: #e0505a;
    --pink: #e07ab0;
  }
  :root[data-theme="light"] {
    --bg: #eef1f6;
    --panel: #ffffff;
    --panel2: #f4f6f9;
    --border: #dbe1ea;
    --text: #1c2230;
    --muted: #6b7280;
    --blue: #2f80c9;
    --gold: #a8790e;
    --red: #cf3f4a;
    --pink: #c65a91;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: 24px;
    transition: background .15s, color .15s;
  }
  a { color: var(--blue); }
  input, select, textarea, button {
    font-family: inherit;
    font-size: 13px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }
  button { cursor: pointer; }

  /* ---------- 로그인 게이트 ---------- */
  #gate {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  #gate .box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px 28px; width: 320px; text-align: center;
  }
  #gate h2 { margin: 0 0 6px; font-size: 18px; }
  #gate p { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
  #gate input { width: 100%; margin-bottom: 10px; }
  #gate button { width: 100%; background: var(--blue); color: #fff; border: none; font-weight: 600; padding: 8px; }
  #gate .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* ---------- 상단 바 ---------- */
  .topbar {
    max-width: 960px; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 18px; margin: 0; }
  .topbar .right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pill-btn {
    border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
    font-size: 12px; padding: 6px 14px; border-radius: 20px;
  }
  .pill-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }
  .pill-btn.admin-on { background: var(--red); color: #fff; border-color: var(--red); font-weight: 600; }

  .layout { max-width: 960px; margin: 0 auto; display: flex; gap: 16px; align-items: flex-start; }
  .deck-list {
    width: 190px; flex: 0 0 190px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px; position: sticky; top: 16px;
  }
  .deck-list .item {
    padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--text);
    margin-bottom: 2px;
  }
  .deck-list .item:hover { background: var(--panel2); }
  .deck-list .item.active { background: var(--blue); color: #fff; }
  .deck-list .newdeck { width: 100%; margin-top: 8px; background: var(--panel2); }
  .main { flex: 1; min-width: 0; }

  /* ---------- 덱 카드 (기존 시안 디자인) ---------- */
  .deck {
    max-width: 900px;
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid var(--border);
  }
  :root[data-theme="light"] .deck { box-shadow: 0 4px 20px rgba(20,30,50,0.08); }
  .deck h1 { font-size: 22px; margin: 0 0 16px 4px; }
  .row { display: grid; gap: 10px; margin-bottom: 14px; }
  .row.chars { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); }
  .row.gear { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); }
  .row.cards { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); }
  .row.pets { grid-template-columns: repeat(3, 0.72fr) 1.8fr; align-items: stretch; gap: 14px; }
  .row.pets > div:not(.position-box) { align-self: start; }

  .card-char { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid var(--border); background: var(--panel2); }
  .card-char img { width: 100%; display: block; aspect-ratio: 3/4; object-fit: cover; }
  .card-char .name { background: #000; color: #fff; text-align: center; font-size: 13px; padding: 6px 0; font-weight: 600; }
  .card-char .badge {
    position: absolute; top: 6px; right: 6px; min-width: 22px; height: 20px; padding: 0 7px;
    border-radius: 6px; color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,0.45);
  }
  .badge-front { background: linear-gradient(135deg, #e8636c, #c93540); }
  .badge-mid   { background: linear-gradient(135deg, #f0c96a, #cf9a2a); }
  .badge-back  { background: linear-gradient(135deg, #5cb0ea, #2f80c9); }

  .gear-cell { text-align: center; }
  .gear-cell img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: var(--panel2); border-radius: 8px; border: 1px solid var(--border); padding: 6px; }
  .gear-cell .label { font-size: 10.5px; color: var(--muted); margin-top: 4px; line-height: 1.3; }

  .card-skill { border-radius: 10px; overflow: hidden; border: 2px solid var(--border); background: var(--panel2); }
  .card-skill img { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: 50% 50%; display: block; }
  .card-skill .name { background: #000; color: #fff; text-align: center; font-size: 12px; padding: 5px 0; }

  .pet-card { border-radius: 10px; overflow: hidden; border: 2px solid var(--border); background: var(--panel2); }
  .pet-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: 50% 22%; display: block; }
  .pet-card .name { background: #000; color: #fff; text-align: center; font-size: 12px; padding: 5px 0; }
  .pet-pos { text-align: center; font-size: 10px; color: var(--gold); margin-bottom: 4px; }

  .position-box { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; height: 100%; }
  .position-box .headers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 8px; flex: 0 0 auto; }
  .position-box .headers div { text-align: center; font-size: 12px; font-weight: 600; background: #2c3040; border-radius: 8px; padding: 5px 0; color: var(--text); }
  :root[data-theme="light"] .position-box .headers div { background: #e4e9f1; }
  .position-box .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1 1 auto; min-height: 0; }
  .position-col { display: flex; flex-direction: column; gap: 6px; justify-content: center; height: 100%; }
  .position-col.single { justify-content: center; }
  .position-col .slot { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .position-col.single .slot { flex: 0 0 auto; height: calc(50% - 3px); }
  .position-col img { width: 100%; flex: 1 1 auto; min-height: 0; border-radius: 8px; object-fit: cover; object-position: 50% 22%; border: 1px solid var(--border); }
  .position-col .pname { font-size: 11px; text-align: center; color: var(--muted); margin-top: 3px; flex: 0 0 auto; }

  .timeline { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 14px; }
  .timeline-title { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .cycle { margin-bottom: 16px; }
  .cycle:last-of-type { margin-bottom: 0; }
  .cycle-label { display: inline-block; font-size: 11px; font-weight: 700; color: #000; background: var(--gold); border-radius: 5px; padding: 2px 8px; margin-bottom: 8px; }
  .timeline-row { display: flex; align-items: flex-start; gap: 4px; flex-wrap: wrap; }
  .step { display: flex; flex-direction: column; align-items: center; width: 92px; position: relative; }
  .step-num { position: absolute; top: -4px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--gold); color: #000; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .step img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; object-position: 50% 22%; border: 2px solid var(--border); }
  .step-name { font-size: 10.5px; margin-top: 4px; text-align: center; color: var(--text); }
  .step-time { font-size: 9.5px; margin-top: 1px; text-align: center; color: var(--blue); }
  .step-memo { font-size: 9.5px; margin-top: 5px; text-align: center; color: var(--muted); line-height: 1.35; word-break: keep-all; border-top: 1px dashed var(--border); padding-top: 4px; width: 100%; }
  .arrow { color: var(--muted); font-size: 14px; padding-top: 14px; }
  .warn-list { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); }
  .warn-item { color: var(--gold); font-size: 13px; line-height: 1.7; }
  .note-tag { display: inline-block; background: #3a3020; color: var(--gold); font-size: 10px; border-radius: 4px; padding: 2px 6px; margin-bottom: 8px; }
  :root[data-theme="light"] .note-tag { background: #fbeecb; color: #8a6612; }

  .title-bar { position: relative; display: flex; align-items: center; min-height: 88px; border-radius: 12px; overflow: hidden; margin-bottom: 16px; background: var(--panel); }
  .title-boss { position: absolute; right: 0; top: 0; height: 100%; width: 720px; max-width: 78%; pointer-events: none; overflow: hidden; }
  .title-boss img {
    position: absolute; right: 0; top: 0; height: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; filter: saturate(1.05);
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 25%, rgba(0,0,0,0.7) 50%, rgba(0,0,0,0.92) 70%, rgba(0,0,0,1) 88%);
    mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 25%, rgba(0,0,0,0.7) 50%, rgba(0,0,0,0.92) 70%, rgba(0,0,0,1) 88%);
  }
  .title-boss::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(to right, var(--panel) 0%, rgba(32,43,61,0.95) 15%, rgba(38,55,79,0.8) 30%, rgba(47,75,108,0.6) 45%, rgba(61,102,144,0.4) 60%, rgba(79,131,173,0.2) 75%, rgba(79,163,227,0.06) 88%, rgba(79,163,227,0) 100%);
  }
  :root[data-theme="light"] .title-boss::before {
    background: linear-gradient(to right, var(--panel) 0%, rgba(255,255,255,0.95) 15%, rgba(219,234,247,0.8) 30%, rgba(179,214,240,0.6) 45%, rgba(148,198,232,0.4) 60%, rgba(115,180,224,0.2) 75%, rgba(79,163,227,0.06) 88%, rgba(79,163,227,0) 100%);
  }
  .title-text { position: relative; z-index: 2; padding: 10px 4px 10px 16px; }
  .title-text h1 { margin: 0 0 8px 0; }

  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }

  /* ---------- 관리자 편집 폼 ---------- */
  .editor { max-width: 900px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 16px; }
  .editor h2 { font-size: 15px; margin: 18px 0 10px; color: var(--gold); }
  .editor h2:first-child { margin-top: 0; }
  .field-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .field-row label { font-size: 12px; color: var(--muted); width: 70px; flex: 0 0 auto; }
  .field-row input, .field-row select, .field-row textarea { flex: 1; min-width: 100px; }
  .slot-editor { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--panel2); }
  .slot-editor .grid2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .slot-editor .grid2 div { display: flex; flex-direction: column; gap: 3px; }
  .slot-editor .grid2 label { font-size: 10.5px; color: var(--muted); }
  .cycle-editor { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--panel2); }
  .step-editor { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .step-editor select, .step-editor input { flex: 1; min-width: 90px; }
  .small-btn { padding: 4px 10px; font-size: 11.5px; }
  .danger { background: var(--red); color: #fff; border: none; }
  .primary { background: var(--blue); color: #fff; border: none; font-weight: 600; }
  .row-btns { display: flex; gap: 6px; margin-top: 6px; }
  .save-bar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 10px 0; margin-top: 16px; display: flex; gap: 10px; justify-content: flex-end; }
  .msg { font-size: 12.5px; padding: 8px 0; }
  .msg.ok { color: #6bd08a; }
  .msg.err { color: var(--red); }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>가온누리 정보 모음</h2>
    <p>길드원 비밀번호를 입력해주세요</p>
    <input id="gate-pw" type="password" placeholder="비밀번호">
    <button onclick="tryLogin()">입장하기</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div class="topbar">
  <h1>가온누리 덱 모음</h1>
  <div class="right">
    <button class="pill-btn active" data-theme-btn="dark" onclick="setTheme('dark')">다크</button>
    <button class="pill-btn" data-theme-btn="light" onclick="setTheme('light')">라이트</button>
    <button class="pill-btn" id="admin-btn" onclick="onAdminBtn()">관리자 모드</button>
  </div>
</div>

<div class="layout">
  <div class="deck-list" id="deck-list">
    <div class="empty" style="padding:20px 8px;">불러오는 중...</div>
  </div>
  <div class="main">
    <div id="viewer"><div class="deck"><div class="empty">왼쪽에서 덱을 선택하세요</div></div></div>
    <div id="editor-wrap"></div>
  </div>
</div>

<script>
/* =========================================================
   설정: Apps Script 웹앱 배포 후 나오는 URL을 여기에 붙여넣으세요.
   예) https://script.google.com/macros/s/AKfycb.../exec
========================================================= */
var API_URL = "https://script.google.com/macros/s/AKfycbzlUzZRvtZuV0Y939_y49H6bxzeHaTOdg5kuHGUsJUbS7orzIbBRYaCRs8z9h78QnmcMQ/exec";

var state = {
  viewPw: '',
  adminPw: '',
  isAdmin: false,
  decks: [],
  currentId: null,
  currentDeck: null,
  characters: [],
  pets: [],
  icons: []
};

/* ---------- 유틸 ---------- */
function api(action, params, method, body) {
  params = params || {};
  method = method || 'GET';
  var url = API_URL + '?action=' + encodeURIComponent(action);
  Object.keys(params).forEach(function (k) { url += '&' + k + '=' + encodeURIComponent(params[k]); });
  if (method === 'GET') {
    return fetch(url).then(function (r) { return r.json(); });
  }
  return fetch(url, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action: action }, body || {}))
  }).then(function (r) { return r.json(); });
}

function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('[data-theme-btn]').forEach(function (b) {
    b.classList.toggle('active', b.dataset.themeBtn === t);
  });
  try { localStorage.setItem('gn_theme', t); } catch (e) {}
}

function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
}); }

/* ---------- 로그인 ---------- */
function tryLogin() {
  var pw = document.getElementById('gate-pw').value;
  document.getElementById('gate-err').textContent = '';
  api('list', { pw: pw }).then(function (res) {
    if (res.ok) {
      state.viewPw = pw;
      try { localStorage.setItem('gn_view_pw', pw); } catch (e) {}
      document.getElementById('gate').style.display = 'none';
      state.decks = res.decks;
      renderDeckList();
      var savedAdmin = null;
      try { savedAdmin = localStorage.getItem('gn_admin_pw'); } catch (e) {}
      if (savedAdmin) tryAdminLogin(savedAdmin, true);
    } else {
      document.getElementById('gate-err').textContent = '비밀번호가 올바르지 않습니다.';
    }
  }).catch(function () {
    document.getElementById('gate-err').textContent = 'API_URL 설정을 확인해주세요.';
  });
}

function onAdminBtn() {
  if (state.isAdmin) {
    state.isAdmin = false;
    state.adminPw = '';
    try { localStorage.removeItem('gn_admin_pw'); } catch (e) {}
    document.getElementById('admin-btn').textContent = '관리자 모드';
    document.getElementById('admin-btn').classList.remove('admin-on');
    document.getElementById('editor-wrap').innerHTML = '';
    return;
  }
  var pw = prompt('관리자 비밀번호를 입력하세요');
  if (pw == null) return;
  tryAdminLogin(pw, false);
}

function tryAdminLogin(pw, silent) {
  api('checkAdmin', { pw: pw }).then(function (res) {
    if (res.ok && res.isAdmin) {
      state.isAdmin = true;
      state.adminPw = pw;
      try { localStorage.setItem('gn_admin_pw', pw); } catch (e) {}
      document.getElementById('admin-btn').textContent = '관리자 모드 ON';
      document.getElementById('admin-btn').classList.add('admin-on');
      renderDeckList();
      if (state.currentDeck) openEditor(state.currentDeck);
    } else if (!silent) {
      alert('관리자 비밀번호가 올바르지 않습니다.');
    }
  });
}

/* ---------- 덱 목록 ---------- */
function renderDeckList() {
  var el = document.getElementById('deck-list');
  var html = '';
  state.decks.forEach(function (d) {
    html += '<div class="item' + (d.id === state.currentId ? ' active' : '') + '" onclick="selectDeck(\'' + d.id + '\')">' + esc(d.title) + '</div>';
  });
  if (state.isAdmin) {
    html += '<button class="pill-btn newdeck" onclick="newDeck()">+ 새 덱 만들기</button>';
  }
  el.innerHTML = html || '<div class="empty" style="padding:20px 8px;">등록된 덱이 없습니다</div>';
}

function selectDeck(id) {
  state.currentId = id;
  document.getElementById('editor-wrap').innerHTML = '';
  renderDeckList();
  api('get', { pw: state.viewPw, id: id }).then(function (res) {
    if (!res.ok) { document.getElementById('viewer').innerHTML = '<div class="deck"><div class="empty">불러오기 실패</div></div>'; return; }
    state.currentDeck = res.deck;
    document.getElementById('viewer').innerHTML = renderDeckHtml(res.deck);
    if (state.isAdmin) openEditor(res.deck);
  });
}

/* =========================================================
   덱 렌더러 (시안 디자인 그대로, 데이터 기반)
========================================================= */
var COL_ORDER = { '후열': 0, '중열': 1, '전열': 2 };
var COL_BADGE = { '후열': 'badge-back', '중열': 'badge-mid', '전열': 'badge-front' };

function sortedCharsForRow(characters) {
  // 상단 카드/장비/스킬카드 행 순서: 후열→중열→전열, 같은 열이면 slot2가 slot1보다 왼쪽(즉 slot 내림차순)
  return characters.slice().sort(function (a, b) {
    var ca = COL_ORDER[a.col], cb = COL_ORDER[b.col];
    if (ca !== cb) return ca - cb;
    return b.slot - a.slot;
  });
}

function renderDeckHtml(deck) {
  var chars = sortedCharsForRow(deck.characters || []);
  var charsHtml = chars.map(function (c) {
    return '<div class="card-char"><img src="' + esc(c.portrait) + '">' +
      '<div class="badge ' + COL_BADGE[c.col] + '">' + c.slot + '</div>' +
      '<div class="name">' + esc(c.name) + '</div></div>';
  }).join('');

  var gearRow1 = chars.map(function (c) {
    return gearCell_(c.weapon) + gearCell_(c.armor);
  }).join('');
  var gearRow2 = chars.map(function (c) {
    return gearCell_(c.item) + gearCell_(c.rune);
  }).join('');

  var cardsHtml = chars.map(function (c) {
    return '<div class="card-skill"><img src="' + esc((c.card && c.card.img) || '') + '"><div class="name">' + esc(c.name) + ' 카드</div></div>';
  }).join('');

  var pets = deck.pets || [];
  var petOrder = { '후열': 0, '중열': 1, '전열': 2 };
  var petsSorted = pets.slice().sort(function (a, b) { return petOrder[a.pos] - petOrder[b.pos]; });
  var petsHtml = petsSorted.map(function (p) {
    return '<div><div class="pet-pos">' + esc(p.pos) + ' 펫</div>' +
      '<div class="pet-card"><img src="' + esc(p.img) + '"><div class="name">' + esc(p.name) + '</div></div></div>';
  }).join('');

  // position box: 컬럼별 그룹핑, slot 오름차순 (1 위 / 2 아래)
  var byCol = { '후열': [], '중열': [], '전열': [] };
  chars.forEach(function (c) { byCol[c.col].push(c); });
  Object.keys(byCol).forEach(function (k) { byCol[k].sort(function (a, b) { return a.slot - b.slot; }); });
  function posColHtml(col) {
    var arr = byCol[col];
    var single = arr.length <= 1 ? ' single' : '';
    var slots = arr.map(function (c) {
      return '<div class="slot"><img src="' + esc(c.portrait) + '"><div class="pname">' + esc(c.name) + '</div></div>';
    }).join('');
    return '<div class="position-col' + single + '">' + slots + '</div>';
  }
  var positionBoxHtml = '<div class="position-box"><div class="headers"><div>후열</div><div>중열</div><div>전열</div></div>' +
    '<div class="cols">' + posColHtml('후열') + posColHtml('중열') + posColHtml('전열') + '</div></div>';

  var timelineHtml = '';
  if (deck.timeline && deck.timeline.cycles && deck.timeline.cycles.length) {
    var cyclesHtml = deck.timeline.cycles.map(function (cy) {
      var stepsHtml = cy.steps.map(function (s, i) {
        var arrow = i < cy.steps.length - 1 ? '<div class="arrow">→</div>' : '';
        return '<div class="step"><div class="step-num">' + (i + 1) + '</div>' +
          '<img src="' + esc(s.img) + '"><div class="step-name">' + esc(s.name) + '</div>' +
          (s.tag ? '<div class="step-time">' + esc(s.tag) + '</div>' : '') +
          (s.memo ? '<div class="step-memo">' + esc(s.memo) + '</div>' : '') +
          '</div>' + arrow;
      }).join('');
      return '<div class="cycle"><div class="cycle-label">' + esc(cy.label) + '</div><div class="timeline-row">' + stepsHtml + '</div></div>';
    }).join('');
    timelineHtml = '<div class="timeline"><div class="timeline-title">스킬 타임라인 — 사이클별 사용 횟수/순서는 덱마다 다를 수 있음</div>' + cyclesHtml;
    if (deck.warnings && deck.warnings.length) {
      timelineHtml += '<div class="warn-list">' + deck.warnings.map(function (w) {
        return '<div class="warn-item">※ ' + esc(w) + '</div>';
      }).join('') + '</div>';
    }
    timelineHtml += '</div>';
  }

  var titleBar = '<div class="title-bar">' +
    (deck.bossIcon ? '<div class="title-boss"><img src="' + esc(deck.bossIcon) + '"></div>' : '') +
    '<div class="title-text"><h1>' + esc(deck.title) + '</h1>' +
    (deck.noteTag ? '<span class="note-tag">' + esc(deck.noteTag) + '</span>' : '') +
    '</div></div>';

  return '<div class="deck">' + titleBar +
    '<div class="row chars" style="grid-template-columns:repeat(' + chars.length + ',1fr)">' + charsHtml + '</div>' +
    '<div class="row gear" style="grid-template-columns:repeat(' + (chars.length * 2) + ',1fr)">' + gearRow1 + '</div>' +
    '<div class="row gear" style="grid-template-columns:repeat(' + (chars.length * 2) + ',1fr)">' + gearRow2 + '</div>' +
    '<div class="row cards" style="grid-template-columns:repeat(' + chars.length + ',1fr)">' + cardsHtml + '</div>' +
    '<div class="row pets">' + petsHtml + positionBoxHtml + '</div>' +
    timelineHtml +
    '</div>';
}

function gearCell_(g) {
  if (!g || (!g.icon && !g.name)) return '<div class="gear-cell"></div>';
  return '<div class="gear-cell"><img src="' + esc(g.icon || '') + '"><div class="label">' + esc(g.name || '') + '</div></div>';
}

/* =========================================================
   관리자 편집 폼
========================================================= */
function newDeck() {
  var id = 'deck_' + Date.now();
  var blank = {
    id: id, title: '새 덱', noteTag: '', bossIcon: '',
    characters: [], pets: [], timeline: { cycles: [] }, warnings: []
  };
  state.currentId = id;
  state.currentDeck = blank;
  state.decks.push({ id: id, title: '새 덱' });
  renderDeckList();
  document.getElementById('viewer').innerHTML = renderDeckHtml(blank);
  openEditor(blank);
}

function loadLibraries() {
  if (state.characters.length) return Promise.resolve();
  return Promise.all([
    api('characters', { pw: state.viewPw }).then(function (r) { if (r.ok) state.characters = r.characters; }),
    api('pets', { pw: state.viewPw }).then(function (r) { if (r.ok) state.pets = r.pets; }),
    api('icons', { pw: state.viewPw }).then(function (r) { if (r.ok) state.icons = r.icons; })
  ]);
}

function findChar_(name) { return state.characters.find(function (c) { return c.name === name; }); }
function findPet_(name) { return state.pets.find(function (p) { return p.name === name; }); }
function findIcon_(name) { return state.icons.find(function (i) { return i.name === name; }); }

function openEditor(deck) {
  var wrap = document.getElementById('editor-wrap');
  wrap.innerHTML = '<div class="editor"><p style="padding:20px;color:var(--muted)">불러오는 중...</p></div>';
  loadLibraries().then(function () {
    var d = JSON.parse(JSON.stringify(deck)); // 편집용 복사본
    wrap.innerHTML = buildEditorHtml_(d);
    wrap._deck = d;
    bindEditorEvents_(wrap);
  });
}

function optionsHtml_(names, selected) {
  return '<option value="">-</option>' + names.map(function (n) {
    return '<option value="' + esc(n) + '"' + (n === selected ? ' selected' : '') + '>' + esc(n) + '</option>';
  }).join('');
}

function buildEditorHtml_(d) {
  var charNames = state.characters.map(function (c) { return c.name; });
  var petNames = state.pets.map(function (p) { return p.name; });

  var slotsHtml = (d.characters || []).map(function (c, i) {
    return '<div class="slot-editor" data-idx="' + i + '">' +
      '<div class="field-row">' +
        '<label>열/순번</label>' +
        '<select class="f-col"><option value="후열"' + (c.col === '후열' ? ' selected' : '') + '>후열</option>' +
        '<option value="중열"' + (c.col === '중열' ? ' selected' : '') + '>중열</option>' +
        '<option value="전열"' + (c.col === '전열' ? ' selected' : '') + '>전열</option></select>' +
        '<select class="f-slot"><option value="1"' + (c.slot === 1 ? ' selected' : '') + '>1</option>' +
        '<option value="2"' + (c.slot === 2 ? ' selected' : '') + '>2</option></select>' +
        '<label>캐릭터</label>' +
        '<select class="f-char">' + optionsHtml_(charNames, c.name) + '</select>' +
        '<button class="small-btn danger f-remove" type="button">삭제</button>' +
      '</div>' +
      '<div class="grid2">' +
        '<div><label>무기</label><input class="f-weapon" value="' + esc(c.weapon && c.weapon.name) + '" placeholder="아이템 이름"></div>' +
        '<div><label>방어구</label><input class="f-armor" value="' + esc(c.armor && c.armor.name) + '" placeholder="아이템 이름"></div>' +
        '<div><label>장신구</label><input class="f-item" value="' + esc(c.item && c.item.name) + '" placeholder="아이템 이름"></div>' +
        '<div><label>룬</label><input class="f-rune" value="' + esc(c.rune && c.rune.name) + '" placeholder="아이템 이름"></div>' +
      '</div>' +
    '</div>';
  }).join('');

  var petsHtml = ['후열', '중열', '전열'].map(function (pos) {
    var p = (d.pets || []).find(function (x) { return x.pos === pos; }) || {};
    return '<div class="field-row" data-pos="' + pos + '">' +
      '<label>' + pos + ' 펫</label>' +
      '<select class="f-pet">' + optionsHtml_(petNames, p.name) + '</select>' +
    '</div>';
  }).join('');

  var cyclesHtml = (d.timeline && d.timeline.cycles || []).map(function (cy, ci) {
    var stepsHtml = cy.steps.map(function (s, si) {
      return '<div class="step-editor" data-si="' + si + '">' +
        '<select class="f-step-char">' + optionsHtml_(charNames, s.name) + '</select>' +
        '<input class="f-step-tag" placeholder="시간/배수 표기 (예: 33.1x)" value="' + esc(s.tag) + '">' +
        '<input class="f-step-memo" placeholder="메모" value="' + esc(s.memo) + '">' +
        '<button class="small-btn danger f-step-remove" type="button">×</button>' +
      '</div>';
    }).join('');
    return '<div class="cycle-editor" data-ci="' + ci + '">' +
      '<div class="field-row"><label>사이클명</label><input class="f-cycle-label" value="' + esc(cy.label) + '">' +
      '<button class="small-btn danger f-cycle-remove" type="button">사이클 삭제</button></div>' +
      '<div class="steps-holder">' + stepsHtml + '</div>' +
      '<button class="small-btn f-step-add" type="button">+ 스텝 추가</button>' +
    '</div>';
  }).join('');

  var warnHtml = (d.warnings || []).map(function (w, i) {
    return '<div class="field-row" data-wi="' + i + '"><input class="f-warn" value="' + esc(w) + '"><button class="small-btn danger f-warn-remove" type="button">×</button></div>';
  }).join('');

  return '<div class="editor">' +
    '<h2>덱 정보</h2>' +
    '<div class="field-row"><label>덱 이름</label><input id="f-title" value="' + esc(d.title) + '"></div>' +
    '<div class="field-row"><label>태그</label><input id="f-notetag" value="' + esc(d.noteTag) + '" placeholder="예: 시안 draft"></div>' +
    '<div class="field-row"><label>보스 이미지</label><input id="f-boss" value="' + esc(d.bossIcon) + '" placeholder="이미지 URL"></div>' +

    '<h2>캐릭터 배치 (전열/중열/후열, 각 1~2명)</h2>' +
    '<div id="slots-holder">' + slotsHtml + '</div>' +
    '<button class="small-btn f-slot-add" type="button">+ 캐릭터 추가</button>' +

    '<h2>펫</h2>' +
    '<div id="pets-holder">' + petsHtml + '</div>' +

    '<h2>스킬 타임라인</h2>' +
    '<div id="cycles-holder">' + cyclesHtml + '</div>' +
    '<button class="small-btn f-cycle-add" type="button">+ 사이클 추가</button>' +

    '<h2>주의사항</h2>' +
    '<div id="warn-holder">' + warnHtml + '</div>' +
    '<button class="small-btn f-warn-add" type="button">+ 주의사항 추가</button>' +

    '<div class="save-bar">' +
      '<span class="msg" id="save-msg"></span>' +
      '<button class="small-btn danger" id="btn-delete" type="button">이 덱 삭제</button>' +
      '<button class="primary" id="btn-save" type="button">저장</button>' +
    '</div>' +
  '</div>';
}

function bindEditorEvents_(wrap) {
  var d = wrap._deck;

  function refresh() { wrap.innerHTML = buildEditorHtml_(d); bindEditorEvents_(wrap); }
  function preview() { document.getElementById('viewer').innerHTML = renderDeckHtml(d); }

  wrap.querySelector('#f-title').oninput = function (e) { d.title = e.target.value; };
  wrap.querySelector('#f-notetag').oninput = function (e) { d.noteTag = e.target.value; };
  wrap.querySelector('#f-boss').oninput = function (e) { d.bossIcon = e.target.value; };

  // 캐릭터 슬롯
  wrap.querySelectorAll('#slots-holder .slot-editor').forEach(function (row) {
    var idx = Number(row.dataset.idx);
    var c = d.characters[idx];
    row.querySelector('.f-col').onchange = function (e) { c.col = e.target.value; };
    row.querySelector('.f-slot').onchange = function (e) { c.slot = Number(e.target.value); };
    row.querySelector('.f-char').onchange = function (e) {
      c.name = e.target.value;
      var lib = findChar_(c.name);
      if (lib) { c.portrait = lib.portrait; c.card = { img: lib.card }; }
    };
    row.querySelector('.f-weapon').oninput = function (e) { c.weapon = gearFromInput_(e.target.value); };
    row.querySelector('.f-armor').oninput = function (e) { c.armor = gearFromInput_(e.target.value); };
    row.querySelector('.f-item').oninput = function (e) { c.item = gearFromInput_(e.target.value); };
    row.querySelector('.f-rune').oninput = function (e) { c.rune = gearFromInput_(e.target.value); };
    row.querySelector('.f-remove').onclick = function () { d.characters.splice(idx, 1); refresh(); };
  });
  wrap.querySelector('.f-slot-add').onclick = function () {
    d.characters.push({ col: '전열', slot: 1, name: '', portrait: '', weapon: {}, armor: {}, item: {}, rune: {}, card: {} });
    refresh();
  };

  // 펫
  wrap.querySelectorAll('#pets-holder .field-row').forEach(function (row) {
    var pos = row.dataset.pos;
    row.querySelector('.f-pet').onchange = function (e) {
      var name = e.target.value;
      d.pets = (d.pets || []).filter(function (p) { return p.pos !== pos; });
      if (name) {
        var lib = findPet_(name);
        d.pets.push({ pos: pos, name: name, img: lib ? lib.image : '' });
      }
    };
  });

  // 타임라인 사이클/스텝
  wrap.querySelectorAll('#cycles-holder .cycle-editor').forEach(function (cyRow) {
    var ci = Number(cyRow.dataset.ci);
    var cy = d.timeline.cycles[ci];
    cyRow.querySelector('.f-cycle-label').oninput = function (e) { cy.label = e.target.value; };
    cyRow.querySelector('.f-cycle-remove').onclick = function () { d.timeline.cycles.splice(ci, 1); refresh(); };
    cyRow.querySelectorAll('.f-step-remove').forEach(function (btn, si) {
      btn.onclick = function () { cy.steps.splice(si, 1); refresh(); };
    });
    cyRow.querySelectorAll('.step-editor').forEach(function (stepRow) {
      var si = Number(stepRow.dataset.si);
      var s = cy.steps[si];
      stepRow.querySelector('.f-step-char').onchange = function (e) {
        s.name = e.target.value;
        var lib = findChar_(s.name);
        s.img = lib ? lib.portrait : '';
      };
      stepRow.querySelector('.f-step-tag').oninput = function (e) { s.tag = e.target.value; };
      stepRow.querySelector('.f-step-memo').oninput = function (e) { s.memo = e.target.value; };
    });
    cyRow.querySelector('.f-step-add').onclick = function () { cy.steps.push({ name: '', img: '', tag: '', memo: '' }); refresh(); };
  });
  wrap.querySelector('.f-cycle-add').onclick = function () {
    if (!d.timeline) d.timeline = { cycles: [] };
    d.timeline.cycles.push({ label: (d.timeline.cycles.length + 1) + '사이클', steps: [] });
    refresh();
  };

  // 주의사항
  wrap.querySelectorAll('#warn-holder .field-row').forEach(function (row) {
    var wi = Number(row.dataset.wi);
    row.querySelector('.f-warn').oninput = function (e) { d.warnings[wi] = e.target.value; };
    row.querySelector('.f-warn-remove').onclick = function () { d.warnings.splice(wi, 1); refresh(); };
  });
  wrap.querySelector('.f-warn-add').onclick = function () {
    if (!d.warnings) d.warnings = [];
    d.warnings.push('');
    refresh();
  };

  // 실시간 미리보기 (입력할 때마다 갱신하고 싶다면 각 이벤트 뒤에 preview() 호출)
  wrap.addEventListener('input', preview);
  wrap.addEventListener('change', preview);

  wrap.querySelector('#btn-save').onclick = function () { saveDeck_ui(d); };
  wrap.querySelector('#btn-delete').onclick = function () { deleteDeck_ui(d.id); };
}

function gearFromInput_(name) {
  if (!name) return { name: '', icon: '' };
  var lib = findIcon_(name);
  return { name: name, icon: lib ? lib.image : '' };
}

function saveDeck_ui(d) {
  var msg = document.getElementById('save-msg');
  msg.textContent = '저장 중...';
  msg.className = 'msg';
  api('save', {}, 'POST', { pw: state.adminPw, deck: d, who: '관리자' }).then(function (res) {
    if (res.ok) {
      msg.textContent = '저장되었습니다.';
      msg.className = 'msg ok';
      state.currentDeck = d;
      var found = state.decks.find(function (x) { return x.id === d.id; });
      if (found) found.title = d.title; else state.decks.push({ id: d.id, title: d.title });
      renderDeckList();
    } else {
      msg.textContent = '저장 실패: ' + (res.error || '');
      msg.className = 'msg err';
    }
  });
}

function deleteDeck_ui(id) {
  if (!confirm('이 덱을 삭제할까요? 되돌릴 수 없습니다.')) return;
  api('delete', {}, 'POST', { pw: state.adminPw, id: id }).then(function (res) {
    if (res.ok) {
      state.decks = state.decks.filter(function (x) { return x.id !== id; });
      state.currentId = null;
      state.currentDeck = null;
      document.getElementById('viewer').innerHTML = '<div class="deck"><div class="empty">왼쪽에서 덱을 선택하세요</div></div>';
      document.getElementById('editor-wrap').innerHTML = '';
      renderDeckList();
    } else {
      alert('삭제 실패: ' + (res.error || ''));
    }
  });
}

/* ---------- 시작 ---------- */
(function init() {
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('gn_theme'); } catch (e) {}
  if (savedTheme) setTheme(savedTheme);

  var savedPw = null;
  try { savedPw = localStorage.getItem('gn_view_pw'); } catch (e) {}
  if (savedPw) {
    document.getElementById('gate-pw').value = savedPw;
    tryLogin();
  }
})();
</script>
